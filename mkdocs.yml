# ============================================================
# MkDocs Configuration — Entoli 
# ============================================================

# ------------------------------------------------------------
# 1. Site Identity
# ------------------------------------------------------------
site_name: "Reis Turkije 2026"
site_description: "Leanne en Hans in Turkije"
site_author: "Hans & Leanne"
site_url: "https://hans-blok.github.io/reis-turkije/"

# Optioneel: repository referentie
# repo_name: "entoli-startup"
# repo_url: "https://github.com/username/mandarin-startup"
# edit_uri: "edit/main/docs/"

# ------------------------------------------------------------
# 2. Documentation Source
# ------------------------------------------------------------
docs_dir: "artefacten"
site_dir: "site"

# ------------------------------------------------------------
# 3. Theme & Presentation
# Entoli house style with Material theme
# ------------------------------------------------------------
theme:
  name: "material"
  language: "en"
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    primary: "red"
    accent: "red"
  font:
    text: "Segoe UI"
    code: "Consolas"
  logo: assets/vlag-turkije.jpg
  favicon: assets/vlag-turkije.jpg

# ------------------------------------------------------------
# 4. Custom Styling - Entoli Stylesheet
# Owner: Presentation Architect
# ------------------------------------------------------------
extra_css: []

extra_javascript: []

# ------------------------------------------------------------
# 5. Plugins
# ------------------------------------------------------------
plugins:
  - search:
      lang: en

# ------------------------------------------------------------
# 6. Markdown Extensions
# ------------------------------------------------------------
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ------------------------------------------------------------
# 7. Navigation Structure
# Primary responsibility: Publication Steward
# ------------------------------------------------------------
nav:
  - Home: index.md
  - Vluchten: vluchten.md
  - Overzicht verblijven: overzicht-verblijven.md
  - Planning:
    - Maandag 28 september: dagen/09-28-maandag.md
    - Dinsdag 29 september: dagen/09-29-dinsdag.md
    - Woensdag 30 september: dagen/09-30-woensdag.md
    - Donderdag 1 oktober: dagen/10-01-donderdag.md
    - Vrijdag 2 oktober: dagen/10-02-vrijdag.md
    - Zaterdag 3 oktober: dagen/10-03-zaterdag.md
    - Zondag 4 oktober: dagen/10-04-zondag.md
    - Maandag 5 oktober: dagen/10-05-maandag.md
    - Dinsdag 6 oktober: dagen/10-06-dinsdag.md
    - Woensdag 7 oktober: dagen/10-07-woensdag.md
    - Donderdag 8 oktober: dagen/10-08-donderdag.md
    - Vrijdag 9 oktober: dagen/10-09-vrijdag.md
    - Zaterdag 10 oktober: dagen/10-10-zaterdag.md
    - Zondag 11 oktober: dagen/10-11-zondag.md
    - Maandag 12 oktober: dagen/10-12-maandag.md
    - Dinsdag 13 oktober: dagen/10-13-dinsdag.md

# ------------------------------------------------------------
# 8. Extra Configuration
# ------------------------------------------------------------
extra:
  social: []
  generator: false  # Verberg "Made with Material for MkDocs"

# ------------------------------------------------------------
# 9. Copyright
# ------------------------------------------------------------
copyright: "Open Source © 2026 Hans & Leanne"

