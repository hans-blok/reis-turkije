# ============================================================
# MkDocs Configuration — Entoli 
# ============================================================

# ------------------------------------------------------------
# 1. Site Identity
# ------------------------------------------------------------
site_name: "Reis Turkije 2026"
site_description: "Leanne en Hans in Turkije"
site_author: "Hans & Leanne"
site_url: "https://hans-blok.github.io/reis-turkije/"

# Optioneel: repository referentie
# repo_name: "entoli-startup"
# repo_url: "https://github.com/username/mandarin-startup"
# edit_uri: "edit/main/docs/"

# ------------------------------------------------------------
# 2. Documentation Source
# ------------------------------------------------------------
docs_dir: "artefacten"
site_dir: "site"

# ------------------------------------------------------------
# 3. Theme & Presentation
# Entoli house style with Material theme
# ------------------------------------------------------------
theme:
  name: "material"
  language: "nl"
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  logo: assets/vlag-turkije.jpg
  favicon: assets/vlag-turkije.jpg

# ------------------------------------------------------------
# 4. Custom Styling - Entoli Stylesheet
# Owner: Presentation Architect
# ------------------------------------------------------------
extra_css:
  # ?v= ophogen bij elke wijziging in custom.css: browsers halen het bestand
  # anders uit hun cache en tonen de oude opmaak bij nieuwe inhoud.
  - assets/custom.css?v=3

extra_javascript: []

# ------------------------------------------------------------
# 5. Plugins
# ------------------------------------------------------------
plugins:
  - search:
      lang: nl

# ------------------------------------------------------------
# 6. Markdown Extensions
# ------------------------------------------------------------
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ------------------------------------------------------------
# 7. Navigation Structure
# Primary responsibility: Publication Steward
# ------------------------------------------------------------
nav:
  - Overzicht: index.md
  - Planning:
    - "ma 28 sep · Istanboel": dagen/09-28-maandag.md
    - "di 29 sep · Istanboel": dagen/09-29-dinsdag.md
    - "wo 30 sep · Istanboel": dagen/09-30-woensdag.md
    - "do 1 okt · Istanboel": dagen/10-01-donderdag.md
    - "vr 2 okt · Göreme": dagen/10-02-vrijdag.md
    - "za 3 okt · Göreme": dagen/10-03-zaterdag.md
    - "zo 4 okt · Göreme": dagen/10-04-zondag.md
    - "ma 5 okt · Konya": dagen/10-05-maandag.md
    - "di 6 okt · Pamukkale": dagen/10-06-dinsdag.md
    - "wo 7 okt · Pamukkale": dagen/10-07-woensdag.md
    - "do 8 okt · Ölüdeniz": dagen/10-08-donderdag.md
    - "vr 9 okt · Ölüdeniz": dagen/10-09-vrijdag.md
    - "za 10 okt · Ölüdeniz": dagen/10-10-zaterdag.md
    - "zo 11 okt · Kaş": dagen/10-11-zondag.md
    - "ma 12 okt · Antalya": dagen/10-12-maandag.md
    - "di 13 okt · terugreis": dagen/10-13-dinsdag.md
  - Verblijven: overzicht-verblijven.md
  - Vluchten: vluchten.md
  - Huurauto: huurauto.md
  - Restaurants: restaurants.md
  - Hotels: voorstel-hotels.md
  - Kaart: kaart.html

# ------------------------------------------------------------
# 8. Extra Configuration
# ------------------------------------------------------------
extra:
  social: []
  generator: false  # Verberg "Made with Material for MkDocs"

# ------------------------------------------------------------
# 9. Copyright
# ------------------------------------------------------------
copyright: "Open Source © 2026 Hans & Leanne"

